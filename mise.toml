[tools]
node = "24.21.0"
pnpm = "12.4.2"
gitleaks = "8.30.1"
lefthook = "2.1.14"

[hooks]
postinstall = "lefthook install"

[tasks."hooks:install"]
description = "Install Git hooks for this checkout"
run = "lefthook install"

[tasks."secrets:staged"]
description = "Scan staged changes for secrets"
run = "gitleaks git --pre-commit --staged --redact --no-banner"

[tasks.secrets]
description = "Scan the full Git history across all branches and tags for secrets"
run = "gitleaks git --log-opts=--all --redact --no-banner"
